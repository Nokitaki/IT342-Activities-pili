<!--templates/error.html-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f7fc;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(103, 58, 183, 0.12);
            border-top: 5px solid #673ab7;
            position: relative;
            overflow: hidden;
        }
        
        .error-container::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: #ffd700;
            opacity: 0.1;
            border-radius: 0 0 0 100%;
        }
        
        .error-header {
            position: relative;
            border-bottom: 1px solid rgba(103, 58, 183, 0.2);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .error-code {
            font-size: 60px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #673ab7, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            line-height: 1;
        }
        
        .error-title {
            color: #673ab7;
            font-weight: 600;
            margin-top: 5px;
            font-size: 24px;
        }
        
        .error-message {
            color: #555;
            margin: 25px 0;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .error-details {
            background-color: #f8f7fc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            border-left: 4px solid #ffd700;
        }
        
        .error-details p {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
        }
        
        .error-details strong {
            color: #673ab7;
            margin-right: 10px;
            min-width: 60px;
            display: inline-block;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #673ab7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(103, 58, 183, 0.3);
        }
        
        .back-button:hover {
            background-color: #5e35b1;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .error-container {
                padding: 30px;
                margin: 20px;
            }
            
            .error-code {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-header">
        <h1 class="error-code" th:text="${status}">500</h1>
        <h2 class="error-title" th:text="${error}">Error</h2>
    </div>

    <div class="error-message">
        <p th:text="${message}">We encountered an issue while processing your request.</p>
    </div>

    <div class="error-details">
        <p><strong>Path:</strong> <span th:text="${path}">Request path</span></p>
        <p><strong>Time:</strong> <span th:text="${timestamp}">Timestamp</span></p>
    </div>

    <a href="/googleuser" class="back-button">Return to Dashboard</a>
</div>
</body>
</html>
